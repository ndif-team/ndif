name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The wheel's version is pyproject.toml's; the release tag must agree
      # (vX.Y.Z -> X.Y.Z), or PyPI and Docker Hub would carry different numbers
      # for one release. Skipped for a manual dispatch, which has no tag.
      - name: Check the tag matches pyproject.toml
        if: github.event_name == 'release'
        run: |
          v="${GITHUB_REF_NAME#v}"
          p=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$v" != "$p" ]; then echo "::error::release tag $v != pyproject.toml version $p"; exit 1; fi
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      
      - name: Build sdist and wheel
        run: python -m build
      
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
