name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

# No job gets a token scope it doesn't ask for. The publish job takes id-token
# (OIDC, for Trusted Publishing); the build job needs nothing at all.
permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      # Full history: setuptools-scm derives the version from the release tag.
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      
      - name: Build sdist and wheel
        run: python -m build
      
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    # Trusted Publishing: PyPI mints a short-lived token from this job's OIDC
    # identity, so there is no API token to store or rotate. PyPI checks the
    # claim against the publisher registered for the project — owner/repo and
    # this workflow's filename (publish.yml), with no environment.
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Pinned to the commit behind v1.14.2: this is the one step in the repo
      # that can publish, so it doesn't track a moving branch.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
