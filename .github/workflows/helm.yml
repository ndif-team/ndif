name: Helm chart

# Lints and renders charts/ndif with its default values and with every
# charts/ndif/ci/*-values.yaml (external S3 with no in-cluster store, and the
# CPU-only smoke stack), then validates the manifests against the Kubernetes
# schemas.

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/helm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform

      - name: Lint, render and validate
        run: |
          set -euo pipefail
          for values in "" charts/ndif/ci/*-values.yaml; do
            echo "::group::${values:-default values}"
            helm lint --strict charts/ndif ${values:+-f "$values"}
            helm template ndif charts/ndif ${values:+-f "$values"} \
              | kubeconform -strict -summary
            echo "::endgroup::"
          done
