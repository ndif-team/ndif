name: Build Images

# One image serves every NDIF service; the container picks what to run from
# NDIF_SERVICE at runtime, and the ECS task definitions (in the ndif-aws repo)
# set that per service.
#
# Manual only (Actions -> Build Images -> Run workflow). Prod's task
# definitions name `prod/ndif:latest`, and ECS re-resolves that tag on every
# new deployment, so anything that moves `latest` is a prod upgrade at the next
# restart.
#
# Tagging is deliberately identical to ndif-aws/push.sh, which is the manual
# path onto the same repositories: every push produces BOTH
#
#   sha-<7-char commit>   immutable, the thing to pin a deploy to
#   latest                mutable convenience pointer
#
# Keep the two in step. The ECR lifecycle policy in ndif-aws keys on `sha-*`
# (it keeps the newest 4) and expires untagged images after 14 days, so an
# image pushed without its sha tag becomes unreferenceable garbage two weeks
# later — including the digest a running task happens to be on.

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: ECR namespace / environment to build for
        type: choice
        options: [dev, test, prod]
        default: dev
      deploy:
        description: Force a new deployment of API and Dashboard after pushing
        type: boolean
        default: false

# One run per namespace at a time, whatever branch it starts from: two runs
# would race for `<namespace>/ndif:latest`. A second run queues, never cancels
# one mid-deploy.
concurrency:
  group: build-images-${{ inputs.namespace }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # type=sha renders as sha-<7 chars>; push.sh builds the same string from
      # `git rev-parse --short=7`. Changing the format here silently breaks the
      # lifecycle policy's `sha-*` rule.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.namespace }}/ndif
          tags: |
            type=sha
            type=raw,value=latest

      # No layer cache: requirements use ranges (nnsight>=…,<…), and a cached
      # install layer keeps whatever resolved when it was built.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Summary
        env:
          NS: ${{ inputs.namespace }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Pushed to \`$NS/ndif\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The services are named rather than discovered from their task
      # definitions: update-service needs only ecs:UpdateService, which the
      # GitHub role has; discovery would also need ecs:DescribeTaskDefinition.
      # Add a name here when another service starts running the ndif image.
      - name: Force new deployment of API and Dashboard
        if: inputs.deploy
        env:
          NS: ${{ inputs.namespace }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          case "$NS" in
            dev)  CLUSTER=NDIF-Dev ;;
            test) CLUSTER=NDIF-Test ;;
            prod) CLUSTER=NDIF-Prod ;;
            *)    echo "unknown namespace $NS" >&2; exit 1 ;;
          esac
          SERVICES=(API Dashboard)

          for name in "${SERVICES[@]}"; do
            aws ecs update-service --cluster "$CLUSTER" --service "$name" \
              --force-new-deployment --no-cli-pager > /dev/null
            echo "redeployed $CLUSTER/$name"
          done

          # The API pulls an ~8 GB image and prod runs min 0% / max 100%, so
          # the old task stops before the new one starts: this wait is the
          # outage window. The waiter gives up after 10 minutes; ECS carries on
          # either way.
          aws ecs wait services-stable --cluster "$CLUSTER" --services "${SERVICES[@]}"
          {
            echo "### Redeployed on \`$CLUSTER\`"
            echo
            printf -- '- %s\n' "${SERVICES[@]}"
            echo
            echo "image digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
