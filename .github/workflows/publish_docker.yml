name: Publish to Docker Hub

# Publishes ndif/ndif on Docker Hub when a GitHub release is published
# (v0.1.0 -> 0.1.0). publish.yml (PyPI) fires on the same event, and both take
# the version from the tag (setuptools-scm on the PyPI side). One image per
# CUDA line, because the torch wheel is chosen at build time from the host's
# CUDA driver (see docker/Dockerfile):
#
#   ndif/ndif:0.1.0-cu126   ndif/ndif:0.1.0   ndif/ndif:latest   (cu126 = default)
#   ndif/ndif:0.1.0-cu130
#
# The resolved torch/transformers/nnsight/ray versions are baked into the image
# (`docker run --rm ndif/ndif version`) and the build inputs are OCI labels.
# The Docker Hub README is docker/README.md, pushed alongside the images.
#
# ECR images for the AWS deployment are a separate workflow (build_images.yml).
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub access token with
# read/write on the ndif org).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag the images with (e.g. 0.1.0)
        required: true
      latest:
        description: Also move the `latest` and bare-version tags
        type: boolean
        default: true

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEFAULT_CUDA: cu126

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda: [cu126, cu130]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The image is ~8 GB and the runner has ~14 GB free; drop the toolchains
      # nobody here needs before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      # The version is the tag with its `v` stripped (or the dispatch input);
      # the same string is what setuptools-scm derives for the wheel, and it is
      # passed into the image build so the package inside reports it too.
      # `latest` and the bare version tag only move for a final release
      # (X.Y.Z); a pre-release like 0.2.0rc1 gets only its own tags.
      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.latest }}" != "false" ] && echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then latest=true; else latest=false; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Every CUDA line gets <version>-<cuda>; the default line also gets the
      # bare <version> and latest.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ndif/ndif
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}-${{ matrix.cuda }}
            type=raw,value=${{ steps.v.outputs.version }},enable=${{ matrix.cuda == env.DEFAULT_CUDA && steps.v.outputs.latest == 'true' }}
            type=raw,value=latest,enable=${{ matrix.cuda == env.DEFAULT_CUDA && steps.v.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}

      # No layer cache: requirements use ranges (nnsight>=…,<…), and a cached
      # install layer keeps whatever resolved when it was built, so a release
      # image could ship older dependencies than `pip install ndif` resolves.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TORCH_CUDA=${{ matrix.cuda }}
            NDIF_VERSION=${{ steps.v.outputs.version }}

  readme:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Push docker/README.md to Docker Hub
        # Pinned to the commit behind v5.0.0: a third-party action that is
        # handed the Docker Hub write token doesn't track a movable tag.
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ndif/ndif
          readme-filepath: docker/README.md
          short-description: The NDIF server, which performs deep inference and serves nnsight requests remotely.
