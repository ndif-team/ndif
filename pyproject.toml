[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ndif"
version = "0.0.1"
description = "The NDIF server, which performs deep inference and serves nnsight requests remotely"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dynamic = ["dependencies"]

[project.scripts]
ndif = "ndif.cli.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ndif*"]
exclude = ["ndif.services.*.tests*", "ndif.cli.tests*"]

[tool.setuptools.package-data]
"ndif" = [".env.example"]
"ndif.services.api" = ["start.sh"]
"ndif.services.ray" = ["start.sh", "start-worker.sh"]
"ndif.services.ray.nn.security" = ["whitelist.yaml"]
"ndif.services.dashboard" = ["start.sh", "config.example.json"]
# The built Vue SPA isn't packaged into site-packages — the docker
# build copies it in at the source-tree path (editable install means
# the dashboard config's default frontend_dist resolves there). For
# non-Docker dev, ``make dashboard-frontend`` (npm run build) writes
# to the source tree's dist/ and config.py auto-resolves it.
"ndif.cli.config" = ["models.yaml"]

[tool.setuptools.dynamic]
dependencies = { file = [
    "src/ndif/services/api/requirements.in",
    "src/ndif/services/ray/requirements.in",
    "src/ndif/services/dashboard/requirements.in",
] }

[dependency-groups]
dev = [
    "ruff>=0.14.5",
    "httpx>=0.28.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
]
