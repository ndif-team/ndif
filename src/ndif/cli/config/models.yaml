# NDIF Model Deployment Configuration
#
# This file defines models to deploy via `ndif deploy -f models.yaml`
#
# Models can be specified in two forms:
#   - Simple: just the checkpoint string (uses default revision and pinned=false)
#   - Full: a mapping with checkpoint, revision, and pinned options
#
# Examples:
#   models:
#     - gpt2                              # Simple form
#     - checkpoint: meta-llama/Llama-3.1-8b  # Full form
#       revision: null
#       pinned: true

models:
  # Simple form - just the checkpoint (revision unset/null, pinned=false)
  - gpt2

  # Full form - with explicit options
  #- checkpoint: meta-llama/Llama-3.1-8B
  #  revision: null
  #  pinned: true
