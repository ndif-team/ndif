# OpenTelemetry Collector — scrapes Ray's Prometheus-format node metrics and
# writes the CPU/GPU/mem profiles into InfluxDB (same `data` bucket as the NDIF
# deployment metrics), so they join to node_gpu/deployment_gpu on
# node_ip + gpu_index. Replaces the standalone Prometheus server.
#
# Requires the *contrib* collector image (prometheus receiver + influxdb
# exporter live in opentelemetry-collector-contrib).

receivers:
  # Reuse the exact discovery file Ray maintains for every node (head +
  # workers), the same one the old Prometheus config consumed. The ray-data
  # volume is mounted at /tmp/ray so this path resolves.
  prometheus:
    config:
      scrape_configs:
        - job_name: ray
          scrape_interval: 15s
          metrics_path: /metrics
          file_sd_configs:
            - files:
                - /tmp/ray/prom_metrics_service_discovery.json

processors:
  # Keep ONLY the CPU / GPU / memory node profiles; drop everything else Ray
  # exports (task/actor/object-store/etc.). NOTE: exact metric names can vary
  # by Ray version (e.g. ray_node_gram_used vs ..._bytes) — verify against a
  # live node's /metrics and adjust if a panel comes back empty.
  filter/profiles:
    metrics:
      include:
        match_type: regexp
        metric_names:
          - "ray_node_cpu_utilization"
          - "ray_node_mem_(used|total|available).*"
          - "ray_node_gpus_utilization"
          - "ray_node_gram_(used|available).*"

  # Align Ray's label names with the NDIF deployment-metric tags so Flux joins
  # are a plain tag match (Ray uses `ip` / `GpuIndex`; we store `node_ip` /
  # `gpu_index`).
  metrics_transform/align:
    transforms:
      - include: ".*"
        match_type: regexp
        action: update
        operations:
          - action: update_label
            label: ip
            new_label: node_ip
          - action: update_label
            label: GpuIndex
            new_label: gpu_index

  batch: {}

exporters:
  # InfluxDB v2 write API. telegraf-prometheus-v1 = one measurement per metric
  # (measurement == metric name, value under field `gauge`), which matches how
  # the rest of the dashboards query InfluxDB.
  influxdb:
    endpoint: http://${env:HOST_IP}:${env:DEV_INFLUXDB_PORT}
    org: ${env:INFLUXDB_ORG}
    bucket: ${env:INFLUXDB_BUCKET}
    token: ${env:INFLUXDB_ADMIN_TOKEN}
    metrics_schema: telegraf-prometheus-v1

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [filter/profiles, metrics_transform/align, batch]
      exporters: [influxdb]
