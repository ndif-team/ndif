# Grafana Tempo — monolithic mode for the local dev stack.
#
# Trace storage is the local filesystem (the `tempo-data` compose volume mounted
# at /var/tempo). This is Tempo's recommended backend for single-binary/dev use
# and keeps the stack self-contained — no object store and no bucket bootstrap.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
