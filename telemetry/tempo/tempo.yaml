# Grafana Tempo — monolithic mode for the local dev stack.
#
# Trace storage lives in MinIO over the S3-compatible API. The `tempo` bucket
# is created at stack boot by the `tempo-init` compose service. Tempo is
# launched with `-config.expand-env=true` so the dollar-brace placeholders
# below resolve from the container environment.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: s3
    s3:
      bucket: ${TEMPO_S3_BUCKET}
      endpoint: ${TEMPO_S3_ENDPOINT}
      access_key: ${TEMPO_S3_ACCESS_KEY}
      secret_key: ${TEMPO_S3_SECRET_KEY}
      insecure: true
      forcepathstyle: true
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
