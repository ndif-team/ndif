{{- /* Inline secret values from values.yaml; existingSecret references skip this. */}}
{{- $data := dict }}
{{- if and .Values.hfToken.value (not .Values.hfToken.existingSecret) }}
{{- $_ := set $data "HF_TOKEN" .Values.hfToken.value }}
{{- end }}
{{- if and .Values.api.postgres.url (not .Values.api.postgres.existingSecret) }}
{{- $_ := set $data "NDIF_POSTGRES_URL" .Values.api.postgres.url }}
{{- end }}
{{- if .Values.rustfs.enabled }}
{{- if not .Values.rustfs.existingSecret }}
{{- $_ := set $data "NDIF_OBJECT_STORE_ACCESS_KEY" .Values.rustfs.accessKey }}
{{- $_ := set $data "NDIF_OBJECT_STORE_SECRET_KEY" .Values.rustfs.secretKey }}
{{- end }}
{{- else if and .Values.objectStore.accessKey (not .Values.objectStore.existingSecret) }}
{{- $_ := set $data "NDIF_OBJECT_STORE_ACCESS_KEY" .Values.objectStore.accessKey }}
{{- $_ := set $data "NDIF_OBJECT_STORE_SECRET_KEY" .Values.objectStore.secretKey }}
{{- end }}
{{- if and .Values.dashboard.enabled (not .Values.dashboard.existingSecret) }}
{{- $_ := set $data "NDIF_DASHBOARD_USERNAME" .Values.dashboard.username }}
{{- $_ := set $data "NDIF_DASHBOARD_PASSWORD_HASH" (required "dashboard.passwordHash is required when the dashboard is enabled" .Values.dashboard.passwordHash) }}
{{- $_ := set $data "NDIF_DASHBOARD_SESSION_SECRET" (required "dashboard.sessionSecret is required when the dashboard is enabled" .Values.dashboard.sessionSecret) }}
{{- end }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ndif.fullname" . }}
  labels:
    {{- include "ndif.labels" (dict "ctx" . "component" "secret") | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
