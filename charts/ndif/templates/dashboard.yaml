{{- if .Values.dashboard.enabled }}
{{- $secret := .Values.dashboard.existingSecret | default (include "ndif.fullname" .) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ndif.fullname" . }}-dashboard
  labels:
    {{- include "ndif.labels" (dict "ctx" . "component" "dashboard") | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.dashboard.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.dashboard.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ndif.fullname" . }}-dashboard
  labels:
    {{- include "ndif.labels" (dict "ctx" . "component" "dashboard") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ndif.selectorLabels" (dict "ctx" . "component" "dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ndif.selectorLabels" (dict "ctx" . "component" "dashboard") | nindent 8 }}
      annotations:
        {{- include "ndif.secretChecksum" (dict "ctx" . "component" "dashboard") | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ndif.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: {{ include "ndif.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: NDIF_SERVICE
              value: dashboard
            - name: NDIF_DASHBOARD_PORT
              value: "8081"
            - name: NDIF_DASHBOARD_DATA_DIR
              value: /var/lib/dashboard
            - name: NDIF_API_URL
              value: "http://{{ include "ndif.apiHost" . }}:{{ .Values.api.service.port }}"
            - name: NDIF_DASHBOARD_MONITOR_URL
              value: "http://{{ include "ndif.apiHost" . }}:{{ .Values.api.service.port }}"
            {{- range $key := list "NDIF_DASHBOARD_USERNAME" "NDIF_DASHBOARD_PASSWORD_HASH" "NDIF_DASHBOARD_SESSION_SECRET" }}
            - name: {{ $key }}
              {{- include "ndif.secretRef" (dict "name" $secret "key" $key) | nindent 14 }}
            {{- end }}
            {{- include "ndif.commonEnv" . | nindent 12 }}
            {{- with .Values.dashboard.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: http, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/dashboard
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ndif.fullname" . }}-dashboard
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ndif.fullname" . }}-dashboard
  labels:
    {{- include "ndif.labels" (dict "ctx" . "component" "dashboard") | nindent 4 }}
spec:
  type: {{ .Values.dashboard.service.type }}
  selector:
    {{- include "ndif.selectorLabels" (dict "ctx" . "component" "dashboard") | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.dashboard.service.port }}, targetPort: http}
{{- end }}
