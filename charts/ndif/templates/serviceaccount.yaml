{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ndif.serviceAccountName" . }}
  labels:
    {{- include "ndif.labels" (dict "ctx" . "component" "serviceaccount") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Pods run user code and NDIF never calls the Kubernetes API. A projected
# cloud-IAM token (IRSA, Workload Identity) is mounted separately.
automountServiceAccountToken: false
{{- end }}
