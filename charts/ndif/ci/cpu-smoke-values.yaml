# CPU-only stack for a laptop or kind cluster: no GPU requests, the Ray head
# only, in-cluster Redis and RustFS, small shm and volumes.
image:
  tag: latest
ray:
  shmSize: 1Gi
  head:
    gpus: 0
    resources:
      requests: {cpu: 500m, memory: 2Gi}
hfCache:
  size: 1Gi
rustfs:
  persistence:
    size: 1Gi
api:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
