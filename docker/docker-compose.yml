# One image, one service per container — selected with NDIF_SERVICE.
#   docker compose -f docker/docker-compose.yml up --build
#
# The `ray` service needs a GPU + the NVIDIA container toolkit on the host.

# Project name: containers/networks are prefixed with this (dev-api-1, ...)
# instead of the compose file's directory ("docker").
name: dev

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Log aggregation. Services ship their `ndif` logs here via the Loki provider
  # (fail-open: if this is down, services keep running and log to console only).
  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready | grep -q ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Metrics store. Services ship numeric time series here via the InfluxDB
  # provider (fail-open: if this is down, services keep running without metrics).
  # setup mode auto-creates the org/bucket/token below on first boot, so the
  # NDIF_INFLUX_* env the services use lines up out of the box.
  influxdb:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminadmin
      DOCKER_INFLUXDB_INIT_ORG: ndif
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ndif-dev-token
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Scrapes Ray's Prometheus-format metrics (ray:8080/metrics — the metrics-export
  # port set in ray/start.sh); Ray is the only service that speaks Prometheus.
  # No depends_on ray: Prometheus starts regardless and retries the scrape until
  # Ray (GPU, slow to boot) is up. UI at http://localhost:9090.
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # View/query logs + metrics: http://localhost:3000 (anonymous admin). The Loki,
  # InfluxDB, Prometheus and Postgres datasources are provisioned so "Explore"
  # works out of the box.
  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Self-hosted hygiene: no phone-home / update or plugin-update checks / news
      # feed; default to UTC; land on the NDIF Overview instead of the empty home.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_USERS_DEFAULT_TIMEZONE: utc
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/ndif-overview.json
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
      - influxdb
      - prometheus

  # User/keys database for API-key auth. init.sql creates the schema + roles
  # (no seed data); the API verifies keys against it via the Postgres provider.
  # Auth is a no-op unless NDIF_POSTGRES_URL is set (it's commented out below).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      # init.sql runs inside this database; the API connects to it as `ndifapi`.
      POSTGRES_DB: ndif
    volumes:
      # Runs once on an empty data dir: schema + roles (no seed data).
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ndif"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object store for result blobs. 9000 = S3 API, 9001 = console.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      # Repo root, so the Dockerfile can COPY src/ and nnsight/.
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      NDIF_SERVICE: api
      # The API reaches redis/ray by service name on the compose network.
      NDIF_REDIS_URL: redis://redis:6379
      NDIF_RAY_ADDRESS: ray://ray:10001
      # Ship logs to Loki (reached by service name on the compose network).
      NDIF_LOKI_URL: http://loki:3100/loki/api/v1/push
      # Ship metrics to InfluxDB (org/bucket/token match the influxdb service).
      NDIF_INFLUX_URL: http://influxdb:8086
      NDIF_INFLUX_TOKEN: ndif-dev-token
      NDIF_INFLUX_ORG: ndif
      NDIF_INFLUX_BUCKET: metrics
      # Object store: reach minio internally; sign download urls for the host.
      NDIF_OBJECT_STORE_URL: http://minio:9000
      NDIF_OBJECT_STORE_PUBLIC_URL: http://localhost:9000
      # API-key auth against the postgres user/keys DB, as the read-only
      # `ndifapi` role (reached by service name). Set -> the API verifies keys;
      # unset -> it runs unauthenticated. Commented out: auth disabled, the API
      # accepts every request (the api_key is only carried for telemetry).
      # NDIF_POSTGRES_URL: postgresql://ndifapi:admin@postgres:5432/ndif
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Admin dashboard (Vue UI + FastAPI): deploy/evict/status, schedules, monitor.
  # Same image as the rest; NDIF_SERVICE=dashboard runs `ndif start dashboard`,
  # which serves uvicorn and — cron being installed in the image — runs the
  # monitor + reconcile crons.
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      NDIF_SERVICE: dashboard
      NDIF_DASHBOARD_PORT: "8081"
      NDIF_DASHBOARD_DATA_DIR: /var/lib/dashboard
      # The /api/status proxy + reconcile/monitor crons reach the rest of the
      # stack by service name on the compose network.
      NDIF_API_URL: http://api:8001
      NDIF_DASHBOARD_MONITOR_URL: http://api:8001
      NDIF_RAY_ADDRESS: ray://ray:10001
      NDIF_REDIS_URL: redis://redis:6379
      # Read-side telemetry for the daily report cron (jobs/report.py). Same
      # org/bucket/token as the writers; the dashboard only ever queries.
      NDIF_INFLUX_URL: http://influxdb:8086
      NDIF_INFLUX_TOKEN: ndif-dev-token
      NDIF_INFLUX_ORG: ndif
      NDIF_INFLUX_BUCKET: metrics
      # Dev: auth disabled so the UI opens without a login. For a real
      # deployment remove this and set NDIF_DASHBOARD_USERNAME, a bcrypt
      # NDIF_DASHBOARD_PASSWORD_HASH (generate with `python -m
      # ndif.services.dashboard.backend.auth hash <password>`), and a random
      # NDIF_DASHBOARD_SESSION_SECRET.
      NDIF_DASHBOARD_DEV_MODE: "true"
    ports:
      - "8081:8081"
    volumes:
      - dashboard_data:/var/lib/dashboard
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  # GPU service — needs a GPU + the NVIDIA container toolkit on the host.
  ray:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      NDIF_SERVICE: ray
      # The controller and model actors publish responses to redis by service
      # name; without this they'd default to localhost:6379 — which inside this
      # container is Ray's own GCS, not redis (the handshake fails there).
      NDIF_REDIS_URL: redis://redis:6379
      # Ship logs to Loki (reached by service name on the compose network).
      NDIF_LOKI_URL: http://loki:3100/loki/api/v1/push
      # Ship metrics to InfluxDB (org/bucket/token match the influxdb service).
      NDIF_INFLUX_URL: http://influxdb:8086
      NDIF_INFLUX_TOKEN: ndif-dev-token
      NDIF_INFLUX_ORG: ndif
      NDIF_INFLUX_BUCKET: metrics
      # Object store: the model actor uploads results to minio internally, but
      # signs download urls with the host-facing address the client will hit.
      NDIF_OBJECT_STORE_URL: http://minio:9000
      NDIF_OBJECT_STORE_PUBLIC_URL: http://localhost:9000
      # Model actor class the controller deploys per replica. Default the sandbox
      # actor: loads the model on the host, runs user code in a separate process
      # and drives the model over IPC (see services/ray/sandbox/model.py).
      NDIF_DEFAULT_MODEL_ACTOR_CLASS: ndif.services.ray.sandbox.model.SandboxModelActor
      # Hugging Face token for gated checkpoints (meta-llama/*, ...). Passed
      # through from the host shell; empty when unset, which is fine for open
      # models. The cache itself is bind-mounted below.
      HF_TOKEN: ${HF_TOKEN:-}
      # Head node: leave NDIF_RAY_HEAD_ADDRESS unset so start.sh starts a head.
      # To run a worker instead, set NDIF_RAY_HEAD_ADDRESS to the head's
      # HOST:PORT (its ray GCS port — NDIF_RAY_HEAD_PORT, 6385 by the CLI's
      # default) and start.sh joins it as a worker. NDIF_RAY_ADDRESS is only the
      # ray:// client address and no longer affects head/worker.
      # Pin models on startup with NDIF_DEPLOYMENTS ("|"-separated model keys).
    # Share the host's Hugging Face cache so downloaded weights persist across
    # `just down` and are reused rather than re-fetched. Container runs as root,
    # so its default HF_HOME is /root/.cache/huggingface.
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    ports:
      - "8265:8265"    # Ray dashboard
      - "10001:10001"  # Ray client server (ray://) — how the api connects
    # Ray's plasma object store lives in /dev/shm; the docker default (64MB) is
    # far too small. Bump for real workloads.
    shm_size: "4gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

# Persist the dashboard's writable state (logs, schedule.json, cache) across
# restarts; everything else in this file is stateless or bind-mounted config.
volumes:
  dashboard_data:
